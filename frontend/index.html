<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NuRI — 나에게 맞는 복지 혜택과 지역 행사를 쉬운 말로 요약해 드려요. 음성으로 편하게 이용하세요." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#4F46E5" />

    <title>NuRI — 맞춤 복지·행사 정보</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script>
      function applyTwemoji(root) {
        if (typeof twemoji !== 'undefined') {
          twemoji.parse(root, { folder: 'svg', ext: '.svg' });
        }
      }
      document.addEventListener('DOMContentLoaded', function () {
        applyTwemoji(document.body);
        new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
              if (node.nodeType === 1) applyTwemoji(node);
            });
          });
        }).observe(document.getElementById('root'), { childList: true, subtree: true });
      });
    </script>
  </body>
</html>
